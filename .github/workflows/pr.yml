# This is a basic workflow to help you get started with Actions

name: CI
permissions:
  contents: read

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

      # Install ruff/misspell
      - name: Install ruff/misspell
        run: |
          set -Eeuox pipefail
    
          mkdir -p "$HOME/.local/bin"
          curl -L https://git.io/misspell | sh -s -- -b "$HOME/.local/bin"
          $HOME/.local/bin/misspell -v
          curl -LsSf https://astral.sh/ruff/install.sh | sh
          ruff -V

      # Check spelling
      - name: Check spelling
        run: |
          set -Eeuox pipefail
    
          $HOME/.local/bin/misspell -error *

      # Check formatting
      - name: Check formatting
        run: |
          set -Eeuox pipefail
    
          ruff format
          
      # Run linter
      - name: Run linter
        run: |
          set -Eeuox pipefail
    
          ruff check

      # Run pytest for examplebench
      - name: Run pytest for examplebench
        run: |
          set -Eeuox pipefail
          if [ -d "example_bench" ]; then
            echo "example_bench exist"
            cd example_bench
            ./test.sh
            cd ..
          fi

      # Run pytest for feabench
      - name: Run pytest for feabench
        run: |
          set -Eeuox pipefail
          if [ -d "feabench" ]; then
            echo "feabench exist"
            cd feabench
            ./test.sh
            cd ..
          fi
